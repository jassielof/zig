name: Sync from Codeberg

on:
  schedule:
    - cron: 0 6 * * *
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Prevents overlapping sync runs (e.g. a manual dispatch while the scheduled
# run is still merging/pushing). Not cancel-in-progress: this job does a
# git push, so a run in flight should finish rather than get killed mid-way.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master

      - name: Sync from Codeberg upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          before="$(git rev-parse HEAD)"
          git remote add upstream https://codeberg.org/ziglang/zig.git
          git fetch upstream master
          git merge --no-edit upstream/master
          after="$(git rev-parse HEAD)"
          git push origin master
          echo "changed=$([ "$before" != "$after" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # A push authenticated with the default GITHUB_TOKEN does NOT trigger
      # other workflows (GitHub deliberately excludes it to avoid infinite
      # trigger loops), so ci.yaml's `on: push` never fires on its own after
      # the push above. Dispatch it explicitly instead, only when the merge
      # actually moved HEAD.
      - name: Trigger CI
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yaml --ref master --repo ${{ github.repository }}
